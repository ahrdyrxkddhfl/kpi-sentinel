# 리포트 생성 설정.
model: "claude-haiku-4-5"
max_tokens: 1200

# 도메인 지식. sentinel은 KPI의 의미를 모르므로 여기서 주입한다.
# 도메인이 바뀌면 이 문자열만 교체한다.
domain_hint: |
  이 리포트의 독자는 이동통신망 운용 담당자다.
  지표는 이동통신망의 품질 지표다.

  부하 지표:
    link_util_pct  - 링크 대역폭 사용률(%). 70~80% 초과 시 혼잡
    prb_util_pct   - 무선 자원 블록 점유율(%). 셀 혼잡도

  품질 지표:
    rtt_ms                 - 왕복 지연(ms). 높을수록 나쁘다
    packet_loss_pct        - 패킷 손실률(%). 높을수록 나쁘다
    jitter_ms              - 지연 변동폭(ms). 높을수록 나쁘다
    sinr_db                - 신호 대 간섭잡음비(dB). 낮을수록 나쁘다
    call_setup_success_pct - 호 접속 성공률(%). 낮을수록 나쁘다

  판단 참고:
    부하 지표만 임계를 넘고 품질 지표가 정상 범위면 정상적인 트래픽
    증가일 가능성이 있다. 부하와 품질이 함께 임계를 넘으면 용량 부족이나
    장애를 의심한다. 호 접속 성공률이 임계를 넘어 하락하면 노드 장애
    가능성이 있다.