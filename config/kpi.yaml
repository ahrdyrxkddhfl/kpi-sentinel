# KPI 정의.
# sentinel/ 모듈은 이 파일의 의미를 알지 못하고 값만 소비한다.
# direction은 이상 주입 방향을 결정한다.
#   higher_is_worse -> 장애 시 값이 위로, lower_is_worse -> 아래로.

sampling:
  interval_sec: 60
  days: 21
  start: "2026-08-03"   # 월요일. 학습 구간이 온전한 주 단위가 되도록 맞춤.
  warmup_days: 7        # 이 구간에는 이상을 주입하지 않는다. baseline 학습용 청정 구간.

kpis:
  rtt_ms:
    baseline: 32.0
    noise_std: 2.0
    direction: higher_is_worse
    season_profile: traffic
    season_amp: 24.0
    clip: [1.0, 500.0]

  packet_loss_pct:
    baseline: 0.15
    noise_std: 0.05
    direction: higher_is_worse
    season_profile: traffic
    season_amp: 0.35
    clip: [0.0, 100.0]

  jitter_ms:
    baseline: 4.0
    noise_std: 0.8
    direction: higher_is_worse
    season_profile: traffic
    season_amp: 3.5
    clip: [0.0, 100.0]

  link_util_pct:
    baseline: 35.0
    noise_std: 3.0
    direction: higher_is_worse
    season_profile: traffic
    season_amp: 40.0
    clip: [0.0, 100.0]

  sinr_db:
    baseline: 18.0
    noise_std: 1.5
    direction: lower_is_worse
    season_profile: traffic_inv   # 혼잡할수록 간섭 증가 -> SINR 하락
    season_amp: 5.0
    clip: [-10.0, 40.0]

  prb_util_pct:
    baseline: 40.0
    noise_std: 3.5
    direction: higher_is_worse
    season_profile: traffic
    season_amp: 38.0
    clip: [0.0, 100.0]

  call_setup_success_pct:
    baseline: 99.2
    noise_std: 0.15
    direction: lower_is_worse
    season_profile: traffic_inv
    season_amp: 0.6
    clip: [0.0, 100.0]

# 일 단위 계절성. 출퇴근 이중 피크 형태.
# 완만한 sine이 아니라 뾰족한 봉우리여야 계절성 미반영 탐지기가 오탐을 낸다.
season:
  weekday_peaks:
    - {center_hour: 9.0,  width: 1.3, weight: 0.85}
    - {center_hour: 13.0, width: 2.5, weight: 0.25}
    - {center_hour: 19.5, width: 1.6, weight: 1.0}
  weekend_scale: 0.45