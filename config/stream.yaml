# 스트림 접속 설정. 브로커를 쓰지 않을 경우 mode를 file로 바꾼다.
mode: kafka          # kafka | file

kafka:
  bootstrap_servers: "localhost:9092"
  topic: "kpi-raw"
  group_id: "kpi-sentinel"

file:
  path: "data/raw/kpi.csv"

# 실시간 재생 속도. 1분 간격 데이터를 몇 초 간격으로 흘려보낼지 정한다.
# 0이면 지연 없이 최대 속도로 보낸다.
replay_delay_sec: 0

# 탐지 단계가 읽을 윈도우 집계 결과. batch 또는 stream.
windowed_source: batch

# 스트림 신뢰성 실험용 다중 개체 데이터.
# 탐지 성능 실험(run_simulate.py)과 별개의 파일로 만들며 그 결과에 영향을 주지 않는다.
multi_entity:
  count: 8
  id_column: "cell_id"     # 파티션 키로 쓸 컬럼
  id_prefix: "cell-"
  path: "data/raw/kpi_cells.csv"
  topic: "kpi-cells"       # 단일 시계열 토픽(kpi-raw)과 분리한다
  partitions: 4
  # librdkafka 기본값(consistent_random, CRC32) 대신 Java 클라이언트와 같은
  # murmur2를 쓴다. 다른 언어의 프로듀서가 붙어도 같은 키가 같은 파티션으로 간다.
  partitioner: "murmur2_random"
  group_id: "kpi-sentinel-cells"
  # 초당 전송 건수. 0이면 제한 없이 최대 속도로 보낸다.
  # 처리 지연을 잴 때는 컨슈머가 따라갈 수 있는 속도로 둔다. 너무 크면 토픽에
  # 쌓이는 대기 시간이 지연에 섞이고, 너무 작으면 실험이 오래 걸린다.
  produce_rate: 0
  batch_size: 500          # 한 번에 읽고 적재하는 최대 메시지 수
  idle_timeout_sec: 10     # 할당 후 이 시간 동안 새 메시지가 없으면 컨슈머를 종료한다
  startup_timeout_sec: 60  # 파티션 할당을 기다리는 최대 시간
  session_timeout_ms: 6000 # 강제 종료된 컨슈머가 그룹에서 빠지기까지의 시간
  # 오프셋 커밋 전략. auto | before_write | after_write | window_safe
  # 각 전략의 차이는 scripts/run_consume_cells.py 상단 설명 참조.
  commit_strategy: "window_safe"

# 컨슈머 강제 종료 실험. scripts/run_crash_experiment.py가 읽는다.
crash_experiment:
  crash_after: 100000      # 이 건수를 처리한 뒤 강제 종료
  stages: ["pre_write", "pre_commit"]
  strategies: ["before_write", "after_write", "window_safe"]
  report_path: "docs/crash_experiment.md"
