# 이상 시나리오 정의.
# magnitude_ratio는 절대값이 아니라 해당 KPI의 계절성 진폭 대비 비율이다.
# 절대값으로 쓰면 KPI마다 단위가 달라(ms, %, dB) 시나리오 간 난이도 비교가 불가능하다.
# affects의 값은 magnitude_ratio에 추가로 곱해지는 KPI별 배수다.
# 같은 사건이라도 KPI마다 영향의 크기가 다르다는 점을 반영한다.

scenarios:
  spike:
    # 순간 스파이크. 짧고 강하게 튄다.
    enabled: true
    count: 6
    duration_min: [8, 15]
    magnitude_ratio: [1.3, 2.0]
    affects:
      rtt_ms: 1.0
      packet_loss_pct: 1.0
      jitter_ms: 0.9

  gradual_degradation:
    # 점진적 열화. 서서히 나빠져 순간 임계값 방식으로는 잡기 어렵다.
    enabled: true
    count: 3
    duration_min: [180, 360]
    magnitude_ratio: [0.8, 1.2]
    affects:
      rtt_ms: 1.0
      packet_loss_pct: 1.1
      sinr_db: 0.8

  node_down:
    # 특정 노드 다운. 부하와 품질이 동시에 무너진다.
    enabled: true
    count: 2
    duration_min: [20, 45]
    magnitude_ratio: [0.9, 1.2]
    affects:
      call_setup_success_pct: 1.4
      prb_util_pct: 1.0
      rtt_ms: 1.0

  config_change:
    # 설정 변경 직후 열화. 변화 폭이 작아 탐지 난도가 높다.
    enabled: true
    count: 3
    duration_min: [60, 150]
    magnitude_ratio: [0.5, 0.8]
    affects:
      sinr_db: 1.0
      prb_util_pct: 0.6
      jitter_ms: 0.9

  traffic_surge:
    # 정상 트래픽 증가. 라벨은 0이다.
    # 부하 지표(link_util, prb_util)는 크게 오르지만 품질 지표는 거의 변하지 않는다.
    # 단일 KPI 임계 방식은 오탐을 내고, 여러 KPI를 함께 보면 걸러낼 수 있는지 확인하는 대조군.
    enabled: true
    count: 4
    duration_min: [90, 200]
    magnitude_ratio: [1.0, 1.4]
    affects:
      link_util_pct: 1.0
      prb_util_pct: 0.95
      rtt_ms: 0.15
      packet_loss_pct: 0.05
    is_anomaly: false

seed: 20260827